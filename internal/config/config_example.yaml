# driftlog configuration example

# Path to the Terraform state file
state_path: terraform.tfstate

# Output format: text | json
output_format: text

# AWS region to query
region: us-east-1

# Limit comparison to specific resource types (empty = all)
resource_types:
  - aws_instance
  - aws_s3_bucket

# Only report resources that have drifted
only_drifted: false

# Local cache settings
cache:
  enabled: true
  path: .driftlog-cache.json
  ttl: 5m
